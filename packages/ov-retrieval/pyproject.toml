[build-system]
# hatchling 1.27 is the first release emitting PEP 639 License-Expression
# metadata; older versions silently fall back to a free-text License field.
requires = ["hatchling>=1.27", "hatch-vcs"]
build-backend = "hatchling.build"

[project]
name = "ov-retrieval"
dynamic = ["version"]
description = "Hybrid fusion and diversity re-ranking for OpenViking retrieval"
readme = "README.md"
# ov_retrieval imports and links against openviking, which is AGPL-3.0.
# openviking declares AGPL-3.0 with no "or later", and a combined work
# cannot widen that.
license = "AGPL-3.0-only"
license-files = ["LICENSE"]
requires-python = ">=3.10"
keywords = ["openviking", "retrieval", "rrf", "mmr", "hybrid-search"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Topic :: Text Processing :: Indexing",
]

dependencies = [
    "openviking>=0.4.16",
    "pydantic>=2",
    "pydantic-settings>=2",
]

[project.scripts]
# OpenViking has no plugin mechanism, so the patch needs somewhere to run.
# Swapping `openviking-server` for this keeps that visible in the process list.
ov-retrieval-server = "ov_retrieval.__main__:main"

[project.urls]
Homepage = "https://github.com/JasperHG90/openviking_extensions"
Issues = "https://github.com/JasperHG90/openviking_extensions/issues"

[tool.hatch.version]
source = "vcs"
raw-options = { root = "../..", search_parent_directories = true }

[tool.hatch.build.targets.wheel]
packages = ["src/ov_retrieval"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Integration tests need Docker and a real OpenViking server, so they stay out
# of the default run. Ask for them with `uv run pytest -m integration`.
addopts = "-m 'not integration'"
asyncio_mode = "auto"
markers = [
    "integration: needs Docker, PostgreSQL with pgvector, and an OpenViking server",
]

[tool.ruff]
line-length = 90
target-version = "py310"

[tool.mypy]
python_version = "3.10"
strict = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["openviking.*", "openviking_cli.*", "testcontainers.*"]
ignore_missing_imports = true

[dependency-groups]
dev = [
    "psycopg>=3.3.4",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "testcontainers>=4.15.0",
]
