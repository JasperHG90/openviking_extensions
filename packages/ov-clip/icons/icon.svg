<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="Save to OpenViking">
  <title>Save to OpenViking</title>
  <rect width="64" height="64" rx="14" fill="#1d4ed8"/>
  <!-- A page, with the corner turned: the thing being clipped. -->
  <path d="M20 14h16l10 10v26a2 2 0 0 1-2 2H20a2 2 0 0 1-2-2V16a2 2 0 0 1 2-2z"
