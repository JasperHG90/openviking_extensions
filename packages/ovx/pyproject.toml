# ovx is a Python package with a console entrypoint. It was a bash script with
# ~500 lines of Python embedded in heredocs, none of which ruff or mypy could
# see; moving it here is what put that third of the code under the gates.
#
# It is deliberately NOT a member of the root uv workspace. A workspace
# resolves one Python floor across every member: ov-postgres still supports
# 3.10, and ovx needs 3.11+ for tomllib. Standing alone, it keeps its own lock
# and its own floor.
[project]
name = "ovx"
description = "Run ov against a named profile, without leaving an API key on disk."
readme = "README.md"
license = "AGPL-3.0-only"
requires-python = ">=3.11"
dynamic = ["version"]
dependencies = [
    "typer>=0.12",
    # Declared explicitly rather than leaned on as typer's transitive dep:
    # cli.py imports it directly to format usage errors.
    "click>=8.1",
]

[project.scripts]
ovx = "ovx.cli:entrypoint"
# Firefox executes a native-messaging host by absolute path and cannot pass it
# arguments, so the host needs an entry point of its own rather than a flag.
ovx-firefox-host = "ovx.native_host:entrypoint"

[project.urls]
Homepage = "https://github.com/JasperHG90/openviking_extensions/tree/main/packages/ovx"

[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

# The version lives in the git tag and nowhere else. hatch-vcs reads it at
# build time; --match scopes it to this package's tags, since the repo holds
# several packages that release independently.
[tool.hatch.version]
source = "vcs"
# The git repository sits two levels above this package. Only git checkouts use
# this; a build from the sdist finds no repo there and takes setuptools-scm's
# PKG-INFO fallback, which reads the version baked in beside this file.
raw-options.root = "../.."
raw-options.git_describe_command = [
    "git", "describe", "--dirty", "--tags", "--long", "--match", "ovx-v*",
]
# A checkout with no ovx-v* tag — a shallow CI clone, or a fresh fork — still
# has to build. Without this the build fails outright rather than reporting an
# honest development version.
raw-options.fallback_version = "0.0.0.dev0"

[tool.hatch.build.hooks.vcs]
version-file = "src/ovx/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["src/ovx"]

[dependency-groups]
dev = [
    "mypy>=1.11",
    "pytest>=8",
    "ruff>=0.6",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
# One test drives the real ov binary against a local server. It needs ov
# installed, so it stays out of the default run; ask for it with
# `uv run pytest -m integration`.
addopts = "-m 'not integration'"
markers = [
    "integration: needs the ov CLI on PATH",
]

[tool.ruff]
line-length = 90
target-version = "py311"
# hatch-vcs writes _version.py at build time. It is gitignored, so ruff skips
# it inside a git checkout -- but not in an sdist or an exported tree, where
# ruff cannot read .gitignore and then fails on generated code nobody edits.
# per-file-ignores would not help: they do not apply to the formatter.
extend-exclude = ["src/ovx/_version.py"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle
    "F",    # pyflakes
    "I",    # isort
    "UP",   # pyupgrade -- enforces modern union/generic syntax
    "B",    # bugbear
    "D",    # pydocstyle -- enforces the docstring rule
    "ANN",  # flake8-annotations -- enforces the type-hint rule
    "RUF",
]
ignore = [
    "D107",    # __init__ docstring; numpy documents params on the class
    "D203",    # incompatible with D211
    "D213",    # incompatible with D212
]

[tool.ruff.lint.per-file-ignores]
# Generated by hatch-vcs at build time.
"src/ovx/_version.py" = ["D100", "ANN"]
# The main command's docstring IS `ovx --help`, and click marks a paragraph it
# must not rewrap with a line holding only \b -- which has to be the real
# escape, so the docstring cannot be raw. Complying with D301 here turned
# click's marker into two literal characters and printed "\b" eleven times in
# the help output.
"src/ovx/cli.py" = ["D301"]

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.mypy]
python_version = "3.11"
strict = true
warn_unreachable = true
files = ["src", "tests"]

[[tool.mypy.overrides]]
module = "ovx._version"
ignore_missing_imports = true
