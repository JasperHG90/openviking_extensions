<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" role="img" aria-label="OpenViking">
  <title>OpenViking</title>
  <!--
    The sign-in page's seal, struck small enough to read as a tab.

    Same longship and same ochre as lib/Seal.svelte, with two differences a
    favicon forces. The colours are literal: a tab icon is loaded on its own,
    outside the page, so it can reach none of app.css's variables. And the
    rings are heavier than the seal's hairlines — at 16px a 0.75 stroke
    disappears, and what is left is an unreadable smudge.

    Kept in step with Seal.svelte by hand. If the mark changes there, it
    changes here.
  -->
  <circle cx="50" cy="50" r="46" fill="none" stroke="#E0A64B" stroke-opacity="0.55" stroke-width="3" />
  <circle cx="50" cy="50" r="40" fill="none" stroke="#E0A64B" stroke-opacity="0.28" stroke-width="1.6" />
  <g fill="#E0A64B" transform="translate(6 2) scale(0.94)" transform-origin="50 50">
    <path d="M44.9 26.2c0.2-1.3 2.1-1.3 2.3 0l3.1 27c0.1 0.9-0.6 1.7-1.5 1.6l-7.4-0.6c-0.9-0.1-1.5-0.9-1.3-1.8z" />
    <path d="M53.2 34c-0.4-1.2 1.2-2 2-1 5.6 7.2 11.1 15.2 14.2 24.1 0.4 1-0.4 2-1.4 1.9l-7.2-0.5c-0.7 0-1.3-0.5-1.4-1.2-1.7-8-3.8-15.8-6.2-23.3z" />
    <path d="M17.9 55.6c-1.2-0.7-0.5-2.6 0.9-2.2 14.4 4.4 29.8 4.8 44.4 1.2 1.3-0.3 2.3 1.2 1.4 2.2-5.9 6.9-14.4 11.1-23.5 11.4-8.5 0.3-16.7-2.7-22.3-8.5z" />
  </g>
</svg>
