[build-system]
# hatchling 1.27 is the first release emitting PEP 639 License-Expression
# metadata; older versions silently fall back to a free-text License field.
requires = ["hatchling>=1.27", "hatch-vcs"]
build-backend = "hatchling.build"

[project]
name = "ov-sync"
dynamic = ["version"]
description = "Sync a local folder into OpenViking, tracking what was sent in a local SQLite file"
readme = "README.md"
# ov-sync talks to OpenViking over HTTP and links against nothing of it, so it
# is not a combined work. AGPL anyway, to match the rest of this repo.
license = "AGPL-3.0-only"
license-files = ["LICENSE"]
# 3.11 for tomllib. Reading the config with a vendored TOML parser would be the
# only reason to go lower, and nothing here has to run on 3.10.
requires-python = ">=3.11"
keywords = ["openviking", "sync", "obsidian", "notes", "sqlite"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Topic :: Utilities",
]

dependencies = [
    # The whole client is four endpoints; httpx gives them a pooled connection,
    # a real timeout, and JSON handling worth not writing.
    "httpx>=0.27",
    "pydantic>=2",
    "pydantic-settings>=2",
    # Retries on 429/5xx. The alternative is a while loop that forgets jitter.
    "tenacity>=8.2",
    "typer>=0.12",
    # Declared rather than leant on as typer's transitive dep: cli.py builds
    # tables and a progress bar with it directly.
    "rich>=13",
    # Event-driven watch mode. Poll mode needs nothing, but a folder you edit
    # in an editor deserves better than a 5-minute poll.
    "watchdog>=4",
]

[project.scripts]
ovsync = "ov_sync.cli:main"

[project.urls]
Homepage = "https://github.com/JasperHG90/openviking_extensions"
Issues = "https://github.com/JasperHG90/openviking_extensions/issues"

# Version comes from git tags, so a build always matches a commit and there is
# no number to forget to bump. Tags carry the package name -- this repo holds
# several packages, and a bare v* tag cannot say which one it releases.
[tool.hatch.version]
source = "vcs"
# The git repository sits two levels above this package. Only git checkouts use
# this; a build from the sdist finds no repo there and takes the PKG-INFO
# fallback, which reads the version baked in beside this file.
raw-options.root = "../.."
# --match is load-bearing, not tidiness: without it `git describe` returns the
# newest tag of *any* package in the repo, so a build here would take ov-ext's
# version.
raw-options.git_describe_command = [
    "git", "describe", "--dirty", "--tags", "--long",
    "--match", "ov-sync-v*",
]

[tool.hatch.build.hooks.vcs]
version-file = "src/ov_sync/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["src/ov_sync"]

# Without this the sdist sweeps in everything not gitignored -- editor config,
# the lockfile, unrelated project files. Name what belongs in a source release.
[tool.hatch.build.targets.sdist]
include = ["/src", "/tests", "/README.md", "/pyproject.toml", "/LICENSE"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Integration tests need a reachable OpenViking server and a writable scope, so
# they stay out of the default run. Ask for them with `uv run pytest -m integration`.
addopts = "-m 'not integration'"
markers = [
    "integration: needs a reachable OpenViking server and a writable target scope",
]

[tool.ruff]
line-length = 90
target-version = "py311"
# hatch-vcs writes _version.py at build time. It is gitignored, so ruff skips
# it inside a git checkout -- but not in an sdist or an exported tree, where
# ruff cannot read .gitignore and then fails on generated code nobody edits.
# per-file-ignores would not help: they do not apply to the formatter.
extend-exclude = ["src/ov_sync/_version.py"]

# Matching ovx, the repo's other standalone CLI package. The default rule set
# is E4/E7/E9/F, which does not include E501, D or ANN -- so the repo's
# docstring and type-hint rules would have no gate here at all, and a line over
# this file's own 90-char limit would pass.
[tool.ruff.lint]
select = [
    "E",    # pycodestyle
    "F",    # pyflakes
    "I",    # isort
    "UP",   # pyupgrade -- enforces modern union/generic syntax
    "B",    # bugbear
    "D",    # pydocstyle -- enforces the docstring rule
    "ANN",  # flake8-annotations -- enforces the type-hint rule
    "RUF",
]
ignore = [
    "D107",    # __init__ docstring; numpy documents params on the class
    "D203",    # incompatible with D211
    "D213",    # incompatible with D212
]

[tool.ruff.lint.per-file-ignores]
# Generated by hatch-vcs at build time.
"src/ov_sync/_version.py" = ["D100", "ANN"]
# A fixture's docstring names what it hands the test -- "an open state
# database" -- which is the pytest convention and reads better than an
# imperative recast of the same words. The response builders take whatever
# JSON a test wants to send, which is what Any is for.
"tests/*" = ["ANN401", "D401"]

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.mypy]
python_version = "3.11"
strict = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["watchdog.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# hatch-vcs writes `_version.py` at build time, so it is absent from a fresh
# checkout. `__init__` already falls back to importlib.metadata when the import
# fails; without this the type check passes locally, where an editable install
# has generated the file, and fails in CI, where nothing has. ov-ext and
# ov-postgres carry the same override for the same reason.
module = ["ov_sync._version"]
ignore_missing_imports = true

[dependency-groups]
dev = [
    # The README's development loop runs these directly. Without them here,
    # `uv run mypy` and `uv run ruff` fail to spawn, and the only way to check
    # this package is through prek.
    "mypy>=1.11",
    "pytest>=8",
    # respx mocks httpx at the transport layer, so the client's own request
    # building, headers, and error mapping stay under test.
    "respx>=0.21",
    "ruff>=0.14",
]
