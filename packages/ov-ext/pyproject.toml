[build-system]
# hatchling 1.27 is the first release emitting PEP 639 License-Expression
# metadata; older versions silently fall back to a free-text License field.
requires = ["hatchling>=1.27", "hatch-vcs"]
build-backend = "hatchling.build"

[project]
name = "ov-ext"
dynamic = ["version"]
description = "Extensions to OpenViking: hybrid retrieval, and reflection over memory"
readme = "README.md"
# ov_ext imports and links against openviking, which is AGPL-3.0.
# openviking declares AGPL-3.0 with no "or later", and a combined work
# cannot widen that.
license = "AGPL-3.0-only"
license-files = ["LICENSE"]
requires-python = ">=3.10"
keywords = ["openviking", "retrieval", "rrf", "mmr", "hybrid-search", "reflection", "memory"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Topic :: Text Processing :: Indexing",
]

dependencies = [
    # Capped deliberately, against the usual advice for libraries. This package
    # binds to OpenViking's *internals*, not its public API: it rebinds
    # `HierarchicalRetriever` by name, calls `super().retrieve`, reads
    # `LEVEL_URI_SUFFIX` and `_append_level_suffix`, and reaches
    # `_build_scope_filter` and `_shared_adapter` on the vector store. None of
    # that is promised to survive a release. OpenViking is pre-1.0, so the
    # minor version is where breakage lands.
    #
    # `install()` verifies what it patches at startup, so an unexpected version
    # fails loudly rather than silently reverting to vector-only -- but a cap
    # stops the bad combination being installed at all. Raise it once a version
    # has been tested, not before.
    "openviking>=0.4.16,<0.5",
    # Spans only -- no SDK, no exporter. OpenViking's server installs the
    # global TracerProvider and owns the endpoint; this package just emits
    # into whatever is already there, and records nothing when that is
    # nothing. Declared even though openviking already requires it: this
    # package imports it directly, and a transitive dependency is not a
    # promise.
    "opentelemetry-api>=1.14",
    "pydantic>=2",
    "pydantic-settings>=2",
    # Imported directly by `rerank`, which pools the connection OpenViking's
    # rerank client opens per call. Declared rather than leant on: openviking
    # already requires it, but a transitive dependency is not a promise.
    "requests>=2.31",
]

[project.optional-dependencies]
# Needed only by deployments that set OV_REFLECT_LOCK=postgres. The lock
# imports psycopg lazily, so a deployment that picks OV_REFLECT_LOCK=process
# never needs it installed.
postgres = ["psycopg>=3.1"]

[project.scripts]
# OpenViking has no plugin mechanism, so the patch needs somewhere to run.
# Swapping `openviking-server` for this keeps that visible in the process list.
ov-ext-server = "ov_ext.__main__:main"

[project.urls]
Homepage = "https://github.com/JasperHG90/openviking_extensions"
Issues = "https://github.com/JasperHG90/openviking_extensions/issues"

# Version comes from git tags, so a build always matches a commit and there is
# no number to forget to bump. Tags carry the package name -- this repo holds
# several packages, and a bare v* tag cannot say which one it releases.
# setuptools-scm's default tag_regex already strips a "<name>-" prefix, so
# "ov-ext-v0.1.0" parses as 0.1.0 without extra config.
[tool.hatch.version]
source = "vcs"
# The git repository sits two levels above this package. Only git checkouts
# use this; a build from the sdist finds no repo there and takes
# setuptools-scm's PKG-INFO fallback, which reads the version baked in beside
# this file.
raw-options.root = "../.."
# --match is load-bearing, not tidiness: without it `git describe` returns the
# newest tag of *any* package in the repo, so a build here would take
# ov-postgres's version.
#
# Both prefixes, because this package was called ov-retrieval up to v0.3.0.
# Repeated --match is an OR, so `git describe` still reaches the pre-rename
# tags and the version line continues from where it left off instead of
# restarting at 0.0.0. Drop the old pattern once an ov-ext-v* tag exists that
# is newer than every ov-retrieval-v* one.
raw-options.git_describe_command = [
    "git", "describe", "--dirty", "--tags", "--long",
    "--match", "ov-ext-v*", "--match", "ov-retrieval-v*",
]

[tool.hatch.build.hooks.vcs]
version-file = "src/ov_ext/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["src/ov_ext"]

# Without this the sdist sweeps in everything not gitignored -- editor config,
# the lockfile, unrelated project files. Name what belongs in a source release.
[tool.hatch.build.targets.sdist]
include = ["/src", "/tests", "/README.md", "/pyproject.toml", "/LICENSE"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Integration tests need Docker and a real OpenViking server, so they stay out
# of the default run. Ask for them with `uv run pytest -m integration`.
addopts = "-m 'not integration'"
asyncio_mode = "auto"
markers = [
    "integration: needs Docker, PostgreSQL with pgvector, and an OpenViking server",
]

[tool.ruff]
line-length = 90
target-version = "py310"

[tool.mypy]
python_version = "3.10"
strict = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["openviking.*", "openviking_cli.*", "testcontainers.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# hatch-vcs writes `_version.py` at build time, so it is absent from a fresh
# checkout. `__init__` already falls back to importlib.metadata when the import
# fails; without this the type check passes locally, where an editable install
# has generated the file, and fails in CI, where nothing has. ov-postgres
# carries the same override for the same reason.
module = ["ov_ext._version"]
ignore_missing_imports = true

[tool.uv.sources]
ov-postgres = { workspace = true }

[dependency-groups]
dev = [
    "ov-postgres",
    "psycopg>=3.3.4",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "testcontainers>=4.15.0",
]
