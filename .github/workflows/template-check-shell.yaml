# Test one shell package. Lint, format and shellcheck run once repo-wide in
# ci.yaml's checks job; this workflow exists for what that job cannot cover —
# running the suite against more than one bash.
name: template-check-shell

on:
  workflow_call:
    inputs:
      package:
        description: "Directory name under packages/, e.g. ovx."
        required: true
        type: string

permissions:
  contents: read

env:
  UV_VERSION: '0.10.x'

jobs:
  check:
    name: ${{ inputs.package }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    # Room for a cold pull of the 2.4 GB OpenViking image before the live suite.
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        # macOS still ships bash 3.2, so it rejects bash 4 syntax that passes
        # everywhere else -- and it is what most contributors on a Mac will
        # run this under. ubuntu covers bash 5.
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          cache-dependency-glob: "packages/${{ inputs.package }}/uv.lock"

      # Which bash ran the suite is the first thing to know when one of these
      # jobs fails and its twin passes.
      - name: Show the bash under test
        run: bash --version

      # A shell package stands outside the root uv workspace, so it syncs from
      # its own lock. --locked fails if that lock has drifted.
      - name: Run unit tests
        run: >
          uv run --locked --directory packages/${{ inputs.package }}
          pytest -v -m "not integration" --color=yes --tb=short

      # Pulled first, so a slow registry shows up as a slow pull, not a test
      # that ran out of time. The OpenViking image is 2.4 GB.
      - name: Pull the integration images
        if: >-
          ${{ runner.os == 'Linux'
              && hashFiles(format('packages/{0}/tests/test_live_openviking.py', inputs.package)) != '' }}
        run: |
          set -euo pipefail
          images=$(grep -rhoE '(ghcr\.io/volcengine/openviking|hashicorp/vault|pgvector/pgvector):[A-Za-z0-9._-]+' \
            packages/${{ inputs.package }}/tests 2>/dev/null | grep -v ':latest$' | sort -u || true)
          for image in $images; do
            docker pull --quiet "$image"
          done

      # The skills' instructions carried out against a real OpenViking, which
      # the suite starts in docker. Linux only: macOS runners have no docker,
      # and what this checks is the server, not the bash. Only this file: the
      # package's other integration tests download releases from GitHub.
      - name: Run the skills against a live OpenViking
        if: >-
          ${{ runner.os == 'Linux'
              && hashFiles(format('packages/{0}/tests/test_live_openviking.py', inputs.package)) != '' }}
        run: >
          uv run --locked --directory packages/${{ inputs.package }}
          pytest -v -m integration tests/test_live_openviking.py --color=yes --tb=short
