# Release one package. Manual only; nothing on main triggers this.
name: release

on:
  workflow_dispatch:
    inputs:
      package:
        description: "Package to release."
        type: choice
        required: true
        options:
          - ov-postgres
          - ovx
          - ov-skills
          - ov-clip
      increment:
        description: "Bump of the package's newest tag; ignored when version is set."
        type: choice
        required: true
        default: PATCH
        options: [PATCH, MINOR, MAJOR]
      version:
        description: "Explicit version to release, e.g. 0.3.0. Overrides increment; required for a first release."
        type: string
        required: false
      dry_run:
        description: "Print the plan without tagging or publishing."
        type: boolean
        required: true
        default: true

permissions:
  contents: read

# Never release the same package twice at once, and never cancel one part way.
concurrency:
  group: release-${{ inputs.package }}
  cancel-in-progress: false

env:
  UV_VERSION: '0.10.x'

jobs:
  guard:
    name: guard
    runs-on: ubuntu-latest
    steps:
      - name: Refuse to release off main
        if: ${{ github.ref != 'refs/heads/main' }}
        # Via env, since a ref name can legally contain shell metacharacters.
        env:
          REF: ${{ github.ref }}
        run: |
          echo "::error::Release must run from main, got $REF."
          exit 1

  # Gates the tag: nothing gets tagged that does not pass its own checks.
  #
  # One job per template, because `uses:` cannot be chosen from an expression.
  # Exactly one runs and the rest skip. Each list repeats ci.yaml's -- there is
  # no way to share a list between workflows, so a new package has to be added
  # in both. ovx used to be on the shell list; it is a Python package now and
  # builds a wheel like ov-postgres.
  test:
    needs: guard
    if: ${{ !contains(fromJSON('["ov-skills", "ov-clip"]'), inputs.package) }}
    uses: ./.github/workflows/template-check.yaml
    with:
      package: ${{ inputs.package }}

  test-shell:
    needs: guard
    if: ${{ contains(fromJSON('["ov-skills"]'), inputs.package) }}
    uses: ./.github/workflows/template-check-shell.yaml
    with:
      package: ${{ inputs.package }}

  test-node:
    needs: guard
    if: ${{ contains(fromJSON('["ov-clip"]'), inputs.package) }}
    uses: ./.github/workflows/template-check-node.yaml
    with:
      package: ${{ inputs.package }}

  release:
    name: plan and tag
    needs: [guard, test, test-shell, test-node]
    # All but one of the test jobs always skips, and a skipped need would block
    # this job under the default rule. Proceed unless something actually
    # failed or was cancelled.
    if: >-
      ${{ !cancelled()
          && !contains(needs.*.result, 'failure')
          && !contains(needs.*.result, 'cancelled') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write # push the tag
    outputs:
      version: ${{ steps.plan.outputs.version }}
      tag: ${{ steps.plan.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # the bump reads the package's existing tags

      # Versions live in git tags and nowhere else: hatch-vcs builds whatever
      # the tag says, so releasing is exactly "pick the next tag". Plain git
      # covers that; no versioning tool needed.
      - name: Work out the version
        id: plan
        env:
          PACKAGE: ${{ inputs.package }}
          INCREMENT: ${{ inputs.increment }}
          EXPLICIT: ${{ inputs.version }}
        shell: bash
        run: |
          set -euo pipefail

          # The newest existing tag for this package, by version order. The
          # tag shape matches hatch-vcs's --match in the package's pyproject.
          LAST_TAG=$(git tag --list "$PACKAGE-v*" --sort=-v:refname | head -n1)
          LAST="${LAST_TAG#"$PACKAGE"-v}"

          if [ -n "$EXPLICIT" ]; then
            VERSION="$EXPLICIT"
          elif [ -z "$LAST_TAG" ]; then
            echo "::error::No $PACKAGE-v* tag exists to bump from."
            echo "::error::Pass an explicit version for the first release."
            exit 1
          elif ! printf '%s' "$LAST" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::Newest tag $LAST_TAG is not plain MAJOR.MINOR.PATCH."
            echo "::error::Pass an explicit version instead of an increment."
            exit 1
          else
            IFS=. read -r major minor patch <<< "$LAST"
            case "$INCREMENT" in
              MAJOR) VERSION="$((major + 1)).0.0" ;;
              MINOR) VERSION="$major.$((minor + 1)).0" ;;
              PATCH) VERSION="$major.$minor.$((patch + 1))" ;;
            esac
          fi

          if ! printf '%s' "$VERSION" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::Version must be MAJOR.MINOR.PATCH, got '$VERSION'."
            exit 1
          fi

          TAG="$PACKAGE-v$VERSION"

          if git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; then
            echo "::error::Tag $TAG already exists."
            exit 1
          fi

          # Versions only move forward: the new one must sort above the newest.
          if [ -n "$LAST_TAG" ]; then
            HIGHEST=$(printf '%s\n%s\n' "$LAST" "$VERSION" | sort -V | tail -n1)
            if [ "$VERSION" = "$LAST" ] || [ "$HIGHEST" != "$VERSION" ]; then
              echo "::error::$VERSION is not above the newest release $LAST."
              exit 1
            fi
          fi

          {
            echo "version=$VERSION"
            echo "tag=$TAG"
          } >> "$GITHUB_OUTPUT"

      - name: Summary
        shell: bash
        run: |
          {
            echo "## ${{ steps.plan.outputs.tag }}"
            echo
            echo "| | |"
            echo "|---|---|"
            echo "| package | \`${{ inputs.package }}\` |"
            echo "| version | \`${{ steps.plan.outputs.version }}\` |"
            echo "| commit | \`${{ github.sha }}\` |"
            echo "| dry run | ${{ inputs.dry_run }} |"
            echo
            if [ "${{ inputs.dry_run }}" = "true" ]; then
              echo "Dry run. Nothing was tagged or published."
              echo "Re-run with **dry_run** unchecked to cut this release."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Tag the release
        if: ${{ !inputs.dry_run }}
        env:
          TAG: ${{ steps.plan.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG" -m "$TAG"
          git push origin "refs/tags/$TAG"

  # Chained via needs: a tag pushed with GITHUB_TOKEN does not trigger
  # workflows. Publishing after tagging means a release only appears with its
  # artifacts attached; if the build fails the tag stands and a re-run of this
  # workflow is not needed -- build locally from the tag and attach by hand,
  # or delete the tag and start over.
  publish:
    name: build and publish
    needs: release
    # `!cancelled()` is load-bearing, not decoration. Without a status-check
    # function GitHub adds an implicit success() covering the dependency
    # graph, and all but one test job is always skipped -- so this job
    # skipped even on a real run, tagging a release that never published.
    # Naming the one result that matters replaces the implicit check.
    if: >-
      ${{ !inputs.dry_run
          && !cancelled()
          && needs.release.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the GitHub release
    steps:
      - uses: actions/checkout@v4
        with:
          # hatch-vcs reads the tag through git describe, so the full history
          # and tags -- including the one just pushed -- must be present.
          fetch-depth: 0

      - uses: astral-sh/setup-uv@v6
        if: ${{ !contains(fromJSON('["ov-skills", "ov-clip"]'), inputs.package) }}
        with:
          version: ${{ env.UV_VERSION }}

      - name: Build package
        if: ${{ !contains(fromJSON('["ov-skills", "ov-clip"]'), inputs.package) }}
        # By path, not --package: --package resolves workspace members only,
        # and a standalone project like ovx is excluded from the workspace.
        run: uv build packages/${{ inputs.package }} --out-dir dist

      - name: Verify the built version matches the tag
        if: ${{ !contains(fromJSON('["ov-skills", "ov-clip"]'), inputs.package) }}
        env:
          VERSION: ${{ needs.release.outputs.version }}
          PACKAGE: ${{ inputs.package }}
        run: |
          set -euo pipefail
          module="${PACKAGE//-/_}"
          built=$(ls dist/*.whl | sed -E "s/.*${module}-([^-]+)-py3.*/\1/")
          echo "planned=$VERSION built=$built"
          test "$VERSION" = "$built"

      # ov-skills is markdown, not a script, so there is nothing to stamp a
      # version into and nothing to run. It ships as a tarball whose root holds
      # skills/ and the Claude Code manifest -- the shape install.sh unpacks,
      # and a drop-in plugin directory for anyone who would rather unpack it by
      # hand.
      - name: Package the skills
        if: ${{ inputs.package == 'ov-skills' }}
        env:
          VERSION: ${{ needs.release.outputs.version }}
        run: |
          set -euo pipefail
          mkdir -p dist stage
          cp -R packages/ov-skills/skills stage/skills
          cp -R packages/ov-skills/.claude-plugin stage/.claude-plugin

          # The manifest carries 0.0.0 in the repository for the same reason
          # ovx.sh carries "dev": the version lives in the git tag, and a real
          # number committed to the file would be free to disagree with it.
          python3 - "$VERSION" <<'PY'
          import json, pathlib, sys
          path = pathlib.Path("stage/.claude-plugin/plugin.json")
          manifest = json.loads(path.read_text())
          manifest["version"] = sys.argv[1]
          path.write_text(json.dumps(manifest, indent=2) + "\n")
          PY

          # Pin the shipped installer to this release. Unstamped it would look
          # the newest release up over the API; someone who downloaded the pair
          # from a release page expects to get that pair, not whatever is
          # newest by the time they run it.
          sed "s|^PINNED_VERSION=.*|PINNED_VERSION=\"$VERSION\"|" \
            packages/ov-skills/install.sh > dist/install.sh
          chmod 755 dist/install.sh

          tar -czf dist/ov-skills.tar.gz -C stage skills .claude-plugin

          # Check the stamps rather than trust them: both are edits against
          # lines that could be renamed at any time, so a tagged release must
          # never ship a manifest saying 0.0.0 or an installer pointing at the
          # wrong release.
          grep -q "^PINNED_VERSION=\"$VERSION\"\$" dist/install.sh
          test "$(python3 -c 'import json;print(json.load(open("stage/.claude-plugin/plugin.json"))["version"])')" = "$VERSION"

          # Unpack the tarball exactly as install.sh does. This is the one
          # check that the archive's root really is skills/ -- the shape the
          # installer's `tar -xz -C "$tmp"` relies on. A --local install would
          # take the cp path instead and prove nothing about the archive.
          mkdir -p "$RUNNER_TEMP/unpack"
          tar -xzf dist/ov-skills.tar.gz -C "$RUNNER_TEMP/unpack"
          test -f "$RUNNER_TEMP/unpack/skills/handoff/SKILL.md"
          test -x "$RUNNER_TEMP/unpack/skills/handoff/scripts/ov-handoff-path.sh"

          # Then install from it, so the stamped installer is exercised too.
          bash dist/install.sh --local "$RUNNER_TEMP/unpack" --to "$RUNNER_TEMP/verify"
          test -f "$RUNNER_TEMP/verify/handoff/SKILL.md"

      # A Firefox extension is neither a wheel nor a script: it is a directory
      # with a manifest, stamped with the version and zipped. Signing turns
      # that into an .xpi release Firefox will install; without AMO credentials
      # the release still carries the unsigned .zip rather than failing, so a
      # fork can cut one.
      - name: Set up the extension
        if: ${{ inputs.package == 'ov-clip' }}
        uses: ./.github/actions/setup-node-package
        with:
          package: ${{ inputs.package }}

      - name: Package the extension
        id: extension
        if: ${{ inputs.package == 'ov-clip' }}
        uses: ./.github/actions/build-firefox-extension
        with:
          package: ${{ inputs.package }}
          version: ${{ needs.release.outputs.version }}
          amo-jwt-issuer: ${{ secrets.AMO_JWT_ISSUER }}
          amo-jwt-secret: ${{ secrets.AMO_JWT_SECRET }}

      - name: Collect the extension and write its install notes
        if: ${{ inputs.package == 'ov-clip' }}
        env:
          ARTIFACT: ${{ steps.extension.outputs.artifact }}
          SIGNED: ${{ steps.extension.outputs.signed }}
          VERSION: ${{ needs.release.outputs.version }}
        run: |
          set -euo pipefail
          mkdir -p dist
          cp "$ARTIFACT" dist/

          {
            echo "## Save to OpenViking $VERSION"
            echo
            echo "A Firefox extension that saves the page you are reading into"
            echo "OpenViking. It holds no credential: it asks \`ovx\` for a token"
            echo "each time it saves."
            echo
            echo "### Install"
            echo
            if [ "$SIGNED" = "true" ]; then
              echo "1. Download the \`.xpi\` below."
              echo "2. Open \`about:addons\`, and drag the file onto the page."
              echo "   (Or gear icon → **Install Add-on From File…**)"
            else
              echo "> This build is **unsigned**, so release Firefox will refuse it."
              echo "> Use Developer Edition or Nightly with"
              echo "> \`xpinstall.signatures.required = false\` in \`about:config\`,"
              echo "> or load it temporarily from \`about:debugging\`."
              echo
              echo "1. Download and unzip the \`.zip\` below."
              echo "2. Open \`about:debugging#/runtime/this-firefox\`."
              echo "3. **Load Temporary Add-on…**, and pick \`manifest.json\`."
            fi
            echo
            echo "### Then set it up"
            echo
            echo '```bash'
            echo "ovx -n                      # make a profile, if you have none"
            echo "ovx --login <profile>       # sign in through Vault"
            echo "ovx --install-firefox-host  # let the extension ask ovx for tokens"
            echo '```'
            echo
            echo "Restart Firefox, open the extension's settings, and pick the"
            echo "profile. Needs ovx $VERSION-era or newer, for the host."
          } > NOTES.md

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.release.outputs.tag }}
        run: |
          set -euo pipefail
          # GitHub generates the notes; unscoped commits may mention other
          # packages. A package that wrote NOTES.md gets those on top, which is
          # where install instructions belong for anything a person installs by
          # hand from the release page.
          args=(--title "$TAG" --target "$GITHUB_SHA" --generate-notes)
          if [ -f NOTES.md ]; then
            args+=(--notes-file NOTES.md)
          fi
          gh release create "$TAG" "${args[@]}" dist/*
