# Release one package. Manual only; nothing on main triggers this.
name: release

on:
  workflow_dispatch:
    inputs:
      package:
        description: "Package to release."
        type: choice
        required: true
        options:
          - ov-postgres
          - ovx
      increment:
        description: "Bump of the package's newest tag; ignored when version is set."
        type: choice
        required: true
        default: PATCH
        options: [PATCH, MINOR, MAJOR]
      version:
        description: "Explicit version to release, e.g. 0.3.0. Overrides increment; required for a first release."
        type: string
        required: false
      dry_run:
        description: "Print the plan without tagging or publishing."
        type: boolean
        required: true
        default: true

permissions:
  contents: read

# Never release the same package twice at once, and never cancel one part way.
concurrency:
  group: release-${{ inputs.package }}
  cancel-in-progress: false

env:
  UV_VERSION: '0.10.x'

jobs:
  guard:
    name: guard
    runs-on: ubuntu-latest
    steps:
      - name: Refuse to release off main
        if: ${{ github.ref != 'refs/heads/main' }}
        # Via env, since a ref name can legally contain shell metacharacters.
        env:
          REF: ${{ github.ref }}
        run: |
          echo "::error::Release must run from main, got $REF."
          exit 1

  # Gates the tag: nothing gets tagged that does not pass its own checks.
  #
  # Two jobs, because `uses:` cannot be chosen from an expression. Exactly one
  # runs and the other skips. The shell-package list repeats ALL_SHELL in
  # ci.yaml -- there is no way to share a list between workflows, so a new
  # shell package has to be added in both.
  test:
    needs: guard
    if: ${{ !contains(fromJSON('["ovx"]'), inputs.package) }}
    uses: ./.github/workflows/template-check.yaml
    with:
      package: ${{ inputs.package }}

  test-shell:
    needs: guard
    if: ${{ contains(fromJSON('["ovx"]'), inputs.package) }}
    uses: ./.github/workflows/template-check-shell.yaml
    with:
      package: ${{ inputs.package }}

  release:
    name: plan and tag
    needs: [guard, test, test-shell]
    # One of the two test jobs always skips, and a skipped need would block
    # this job under the default rule. Proceed unless something actually
    # failed or was cancelled.
    if: >-
      ${{ !cancelled()
          && !contains(needs.*.result, 'failure')
          && !contains(needs.*.result, 'cancelled') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write # push the tag
    outputs:
      version: ${{ steps.plan.outputs.version }}
      tag: ${{ steps.plan.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # the bump reads the package's existing tags

      # Versions live in git tags and nowhere else: hatch-vcs builds whatever
      # the tag says, so releasing is exactly "pick the next tag". Plain git
      # covers that; no versioning tool needed.
      - name: Work out the version
        id: plan
        env:
          PACKAGE: ${{ inputs.package }}
          INCREMENT: ${{ inputs.increment }}
          EXPLICIT: ${{ inputs.version }}
        shell: bash
        run: |
          set -euo pipefail

          # The newest existing tag for this package, by version order. The
          # tag shape matches hatch-vcs's --match in the package's pyproject.
          LAST_TAG=$(git tag --list "$PACKAGE-v*" --sort=-v:refname | head -n1)
          LAST="${LAST_TAG#"$PACKAGE"-v}"

          if [ -n "$EXPLICIT" ]; then
            VERSION="$EXPLICIT"
          elif [ -z "$LAST_TAG" ]; then
            echo "::error::No $PACKAGE-v* tag exists to bump from."
            echo "::error::Pass an explicit version for the first release."
            exit 1
          elif ! printf '%s' "$LAST" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::Newest tag $LAST_TAG is not plain MAJOR.MINOR.PATCH."
            echo "::error::Pass an explicit version instead of an increment."
            exit 1
          else
            IFS=. read -r major minor patch <<< "$LAST"
            case "$INCREMENT" in
              MAJOR) VERSION="$((major + 1)).0.0" ;;
              MINOR) VERSION="$major.$((minor + 1)).0" ;;
              PATCH) VERSION="$major.$minor.$((patch + 1))" ;;
            esac
          fi

          if ! printf '%s' "$VERSION" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::Version must be MAJOR.MINOR.PATCH, got '$VERSION'."
            exit 1
          fi

          TAG="$PACKAGE-v$VERSION"

          if git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; then
            echo "::error::Tag $TAG already exists."
            exit 1
          fi

          # Versions only move forward: the new one must sort above the newest.
          if [ -n "$LAST_TAG" ]; then
            HIGHEST=$(printf '%s\n%s\n' "$LAST" "$VERSION" | sort -V | tail -n1)
            if [ "$VERSION" = "$LAST" ] || [ "$HIGHEST" != "$VERSION" ]; then
              echo "::error::$VERSION is not above the newest release $LAST."
              exit 1
            fi
          fi

          {
            echo "version=$VERSION"
            echo "tag=$TAG"
          } >> "$GITHUB_OUTPUT"

      - name: Summary
        shell: bash
        run: |
          {
            echo "## ${{ steps.plan.outputs.tag }}"
            echo
            echo "| | |"
            echo "|---|---|"
            echo "| package | \`${{ inputs.package }}\` |"
            echo "| version | \`${{ steps.plan.outputs.version }}\` |"
            echo "| commit | \`${{ github.sha }}\` |"
            echo "| dry run | ${{ inputs.dry_run }} |"
            echo
            if [ "${{ inputs.dry_run }}" = "true" ]; then
              echo "Dry run. Nothing was tagged or published."
              echo "Re-run with **dry_run** unchecked to cut this release."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Tag the release
        if: ${{ !inputs.dry_run }}
        env:
          TAG: ${{ steps.plan.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG" -m "$TAG"
          git push origin "refs/tags/$TAG"

  # Chained via needs: a tag pushed with GITHUB_TOKEN does not trigger
  # workflows. Publishing after tagging means a release only appears with its
  # artifacts attached; if the build fails the tag stands and a re-run of this
  # workflow is not needed -- build locally from the tag and attach by hand,
  # or delete the tag and start over.
  publish:
    name: build and publish
    needs: release
    # `!cancelled()` is load-bearing, not decoration. Without a status-check
    # function GitHub adds an implicit success() covering the dependency
    # graph, and one of test/test-shell is always skipped -- so this job
    # skipped even on a real run, tagging a release that never published.
    # Naming the one result that matters replaces the implicit check.
    if: >-
      ${{ !inputs.dry_run
          && !cancelled()
          && needs.release.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the GitHub release
    steps:
      - uses: actions/checkout@v4
        with:
          # hatch-vcs reads the tag through git describe, so the full history
          # and tags -- including the one just pushed -- must be present.
          fetch-depth: 0

      - uses: astral-sh/setup-uv@v6
        if: ${{ !contains(fromJSON('["ovx"]'), inputs.package) }}
        with:
          version: ${{ env.UV_VERSION }}

      - name: Build package
        if: ${{ !contains(fromJSON('["ovx"]'), inputs.package) }}
        run: uv build --package ${{ inputs.package }}

      - name: Verify the built version matches the tag
        if: ${{ !contains(fromJSON('["ovx"]'), inputs.package) }}
        env:
          VERSION: ${{ needs.release.outputs.version }}
          PACKAGE: ${{ inputs.package }}
        run: |
          set -euo pipefail
          module="${PACKAGE//-/_}"
          built=$(ls dist/*.whl | sed -E "s/.*${module}-([^-]+)-py3.*/\1/")
          echo "planned=$VERSION built=$built"
          test "$VERSION" = "$built"

      # A shell package has nothing to compile. hatch-vcs cannot stamp a
      # version into it either, so do it here: the script carries
      # <PACKAGE>_VERSION="dev" in a checkout, and the release ships a copy
      # reporting the tag. The version still lives only in the tag.
      - name: Package the shell script
        if: ${{ contains(fromJSON('["ovx"]'), inputs.package) }}
        env:
          VERSION: ${{ needs.release.outputs.version }}
          PACKAGE: ${{ inputs.package }}
        run: |
          set -euo pipefail
          mkdir -p dist
          src="packages/$PACKAGE/$PACKAGE.sh"
          var="$(printf '%s' "$PACKAGE" | tr 'a-z-' 'A-Z_')_VERSION"

          sed "s/^${var}=\"dev\"\$/${var}=\"${VERSION}\"/" "$src" > "dist/$PACKAGE.sh"
          chmod 755 "dist/$PACKAGE.sh"

          # Point the shipped installer at this release's asset. Copied
          # unchanged it would default to main, so someone downloading
          # install.sh from the release page would get main's script sitting
          # next to the pinned one -- the opposite of what a release is for.
          asset="https://github.com/$GITHUB_REPOSITORY/releases/download"
          sed "s|^DEFAULT_URL=.*|DEFAULT_URL=\"$asset/$PACKAGE-v$VERSION/$PACKAGE.sh\"|" \
            "packages/$PACKAGE/install.sh" > dist/install.sh
          chmod 755 dist/install.sh

          # Both stamps are plain seds against lines that could be renamed at
          # any time. Check them rather than trust them, so a tagged release
          # can never ship a script reporting "dev" or an installer pointing
          # at the wrong place.
          got="$(bash "dist/$PACKAGE.sh" -V)"
          echo "planned=$PACKAGE $VERSION got=$got"
          test "$got" = "$PACKAGE $VERSION"
          grep -q "releases/download/$PACKAGE-v$VERSION/$PACKAGE.sh" dist/install.sh

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.release.outputs.tag }}
        run: |
          set -euo pipefail
          # GitHub generates the notes; unscoped commits may mention other packages.
          gh release create "$TAG" --title "$TAG" --target "$GITHUB_SHA" --generate-notes dist/*
