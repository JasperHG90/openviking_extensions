# Checks and tests. Never releases; that is release.yaml, run by hand.
name: ci

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch: # runs every package, for after a change the filters missed

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # Supersede an older run on the same PR; let a main run finish so main's
  # check history stays complete.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # Matches the uv that wrote uv.lock; --locked in template-check trusts that.
  UV_VERSION: '0.10.x'

jobs:
  # Whole repo in one run, so CI and a local `prek` use identical tool versions.
  checks:
    name: checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          # hatch-vcs needs tags to resolve a version during `uv run pytest`.
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v6
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - name: Run prek hooks
        run: uvx prek@0.2.25 run --all-files --show-diff-on-failure

  # The package list lives in the filters below and in the two fallback lists;
  # a new package adds one filter block and one name, in the list matching the
  # template that builds it. Every filter also names the shared files a package
  # depends on: the workspace files and the workflows.
  detect:
    name: detect changed packages
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read # paths-filter reads the PR file list from the API
    outputs:
      python_packages: ${{ steps.select.outputs.python_packages }}
      shell_packages: ${{ steps.select.outputs.shell_packages }}
      node_packages: ${{ steps.select.outputs.node_packages }}
    steps:
      - uses: actions/checkout@v4

      - id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            ov-postgres:
              - packages/ov-postgres/**
              - pyproject.toml
              - uv.lock
              - .pre-commit-config.yaml
              - .github/**
            ov-retrieval:
              - packages/ov-retrieval/**
              - pyproject.toml
              - uv.lock
              - .pre-commit-config.yaml
              - .github/**
            ovx:
              - packages/ovx/**
              - .pre-commit-config.yaml
              - .github/**
            ov-skills:
              - packages/ov-skills/**
              - .pre-commit-config.yaml
              - .github/**
            ov-dash:
              - packages/ov-dash/**
              - .github/**
            ov-clip:
              - packages/ov-clip/**
              - .github/**

      # Split the changed set by which template can build each package: a
      # Python package gets a wheel built and imported, a shell package gets
      # its suite run against several bashes. Neither template can stand in
      # for the other, so they are separate jobs over separate lists.
      #
      # workflow_dispatch has no base to diff against, so fall back to every
      # package.
      - id: select
        shell: bash
        env:
          EVENT: ${{ github.event_name }}
          CHANGED: ${{ steps.filter.outputs.changes }}
        run: |
          set -euo pipefail
          ALL_PYTHON='["ov-postgres", "ov-retrieval", "ovx"]'
          # ov-skills ships markdown and bash, so it takes the shell template:
          # its installer has to work on the bash 3.2 macOS still ships.
          ALL_SHELL='["ov-skills"]'
          ALL_NODE='["ov-dash", "ov-clip"]'

          if [ "$EVENT" = "workflow_dispatch" ]; then
            changed=$(jq -c -n \
              --argjson p "$ALL_PYTHON" --argjson s "$ALL_SHELL" --argjson n "$ALL_NODE" \
              '$p + $s + $n')
          else
            changed="$CHANGED"
          fi

          # jq treats only false and null as falsy, so index() returning 0 for
          # a first-position match still selects.
          pick() {
            jq -c --argjson known "$1" '[.[] | select(. as $x | $known | index($x))]' \
              <<<"$changed"
          }
          python_packages=$(pick "$ALL_PYTHON")
          shell_packages=$(pick "$ALL_SHELL")
          node_packages=$(pick "$ALL_NODE")

          {
            echo "python_packages=$python_packages"
            echo "shell_packages=$shell_packages"
            echo "node_packages=$node_packages"
          } >> "$GITHUB_OUTPUT"
          echo "Python: $python_packages"
          echo "Shell:  $shell_packages"
          echo "Node:   $node_packages"

  test:
    needs: detect
    if: ${{ needs.detect.outputs.python_packages != '[]' && needs.detect.outputs.python_packages != '' }}
    strategy:
      fail-fast: false
      matrix:
        package: ${{ fromJSON(needs.detect.outputs.python_packages) }}
    uses: ./.github/workflows/template-check.yaml
    with:
      package: ${{ matrix.package }}

  test-shell:
    needs: detect
    if: ${{ needs.detect.outputs.shell_packages != '[]' && needs.detect.outputs.shell_packages != '' }}
    strategy:
      fail-fast: false
      matrix:
        package: ${{ fromJSON(needs.detect.outputs.shell_packages) }}
    uses: ./.github/workflows/template-check-shell.yaml
    with:
      package: ${{ matrix.package }}

  test-node:
    needs: detect
    if: ${{ needs.detect.outputs.node_packages != '[]' && needs.detect.outputs.node_packages != '' }}
    strategy:
      fail-fast: false
      matrix:
        package: ${{ fromJSON(needs.detect.outputs.node_packages) }}
    uses: ./.github/workflows/template-check-node.yaml
    with:
      package: ${{ matrix.package }}
