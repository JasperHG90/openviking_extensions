exclude: ^(\.agents/|\.claude/(agents|rules|skills)/|\.opencode/|opencode\.json$)
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: mixed-line-ending
      - id: check-yaml
      - id: check-toml
      - id: check-json
      - id: check-merge-conflict
      - id: check-case-conflict
      - id: check-added-large-files
      - id: detect-private-key

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.14.2
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format

  # Hooks below are scoped per package. A new package adds its own entries
  # with its own `files:` pattern; ruff needs no scoping because each package
  # carries its own [tool.ruff] and ruff picks the nearest config per file.
  - repo: https://github.com/koalaman/shellcheck-precommit
    rev: v0.10.0
    hooks:
      - id: shellcheck
        name: shellcheck (ov-skills)
        files: ^packages/ov-skills/.*\.sh$

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.18.2
    hooks:
      - id: mypy
        name: mypy (ov-postgres)
        files: ^packages/ov-postgres/(src|tests)/
        additional_dependencies:
          # opentelemetry-sdk is here for the tests, which assert on exported
          # spans; src imports the API alone.
          - opentelemetry-api>=1.14
          - opentelemetry-sdk>=1.14
          - psycopg[binary,pool]>=3.1
          - pydantic>=2
          - pytest>=7
        args: [--config-file=packages/ov-postgres/pyproject.toml]

      - id: mypy
        name: mypy (ov-ext)
        files: ^packages/ov-ext/(src|tests)/
        additional_dependencies:
          # opentelemetry-sdk is here for the tests, which assert on exported
          # spans; src imports the API alone.
          - opentelemetry-api>=1.14
          - opentelemetry-sdk>=1.14
          - pydantic>=2
          - pydantic-settings>=2
          - pytest>=7
          # The reflection tests parse the shipped memory-type schema to prove
          # it stays a valid one; PyYAML has no inline types.
          - types-PyYAML
          # The sweep lock imports psycopg lazily, under the `postgres` extra.
          - psycopg[binary,pool]>=3.1
          # `rerank` imports requests to pool the rerank client's connection.
          - types-requests>=2.31
        args: [--config-file=packages/ov-ext/pyproject.toml]

      - id: mypy
        name: mypy (ovx)
        # src as well as tests: ovx is a package now, and scoping this to
        # tests/ made the hook pass over a deliberate type error in src/.
        files: ^packages/ovx/(src|tests)/
        additional_dependencies:
          - pytest>=8
          - typer>=0.12
        args: [--config-file=packages/ovx/pyproject.toml]

      - id: mypy
        name: mypy (ov-sync)
        files: ^packages/ov-sync/(src|tests)/
        additional_dependencies:
          - httpx>=0.27
          - pydantic>=2
          - pydantic-settings>=2
          # respx and pytest are here for the tests, which build responses and
          # fixtures the checker has to see typed.
          - pytest>=8
          - respx>=0.21
          - rich>=13
          - tenacity>=8.2
          - typer>=0.12
          # Event-mode watch. The package's mypy config ignores its missing
          # stubs, but the import still has to resolve.
          - watchdog>=4
        args: [--config-file=packages/ov-sync/pyproject.toml]

      - id: mypy
        name: mypy (ov-skills)
        files: ^packages/ov-skills/tests/
        additional_dependencies:
          - pytest>=8
          - types-pyyaml>=6
        args: [--config-file=packages/ov-skills/pyproject.toml]

  - repo: local
    hooks:

      # ov-dash carries its own toolchain: ruff and mypy cannot read TypeScript
      # or Svelte, so its gates run through npm. They need `npm install` in
      # packages/ov-dash first, which the package README says.
      - id: check-ov-dash
        name: tsc + svelte-check (ov-dash)
        entry: npm --prefix packages/ov-dash run check
        language: system
        pass_filenames: false
        files: ^packages/ov-dash/

      - id: lint-ov-dash
        name: biome (ov-dash)
        entry: npm --prefix packages/ov-dash run lint
        language: system
        pass_filenames: false
        files: ^packages/ov-dash/

      # ov-clip is the same story: a Firefox extension in TypeScript, with its
      # own toolchain and its own `npm install` to run first. Its lint also
      # builds and runs `web-ext lint`, which is what checks the manifest.
      - id: check-ov-clip
        name: tsc (ov-clip)
        entry: npm --prefix packages/ov-clip run check
        language: system
        pass_filenames: false
        files: ^packages/ov-clip/

      - id: lint-ov-clip
        name: biome + web-ext (ov-clip)
        entry: npm --prefix packages/ov-clip run lint
        language: system
        pass_filenames: false
        files: ^packages/ov-clip/
