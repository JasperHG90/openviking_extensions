repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.14.2
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format

  # Hooks below are scoped per package. A new package adds its own entries
  # with its own `files:` pattern; ruff needs no scoping because each package
  # carries its own [tool.ruff] and ruff picks the nearest config per file.
  - repo: https://github.com/koalaman/shellcheck-precommit
    rev: v0.10.0
    hooks:
      - id: shellcheck
        name: shellcheck (ov-skills)
        files: ^packages/ov-skills/.*\.sh$

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.18.2
    hooks:
      - id: mypy
        name: mypy (ov-postgres)
        files: ^packages/ov-postgres/(src|tests)/
        additional_dependencies:
          - psycopg[binary,pool]>=3.1
          - pydantic>=2
          - pytest>=7
        args: [--config-file=packages/ov-postgres/pyproject.toml]

      - id: mypy
        name: mypy (ovx)
        # src as well as tests: ovx is a package now, and scoping this to
        # tests/ made the hook pass over a deliberate type error in src/.
        files: ^packages/ovx/(src|tests)/
        additional_dependencies:
          - pytest>=8
          - typer>=0.12
        args: [--config-file=packages/ovx/pyproject.toml]

      - id: mypy
        name: mypy (ov-skills)
        files: ^packages/ov-skills/tests/
        additional_dependencies:
          - pytest>=8
          - types-pyyaml>=6
        args: [--config-file=packages/ov-skills/pyproject.toml]

  - repo: local
    hooks:
      # The unit suite is fast and offline, so it runs on every commit.
      # Integration tests need a container and stay opt-in via `-m integration`.
      - id: pytest-unit-ov-postgres
        name: pytest (ov-postgres, unit)
        entry: uv run --directory packages/ov-postgres pytest
        language: system
        pass_filenames: false
        files: ^packages/ov-postgres/
        types: [python]

      - id: pytest-unit-ovx
        name: pytest (ovx, unit)
        entry: uv run --directory packages/ovx pytest
        language: system
        pass_filenames: false
        files: ^packages/ovx/

      # Same again: what ov-skills tests is markdown and shell, so the trigger
      # cannot be limited to Python files either.
      - id: pytest-unit-ov-skills
        name: pytest (ov-skills, unit)
        entry: uv run --directory packages/ov-skills pytest
        language: system
        pass_filenames: false
        files: ^packages/ov-skills/

      # ov-dash carries its own toolchain: ruff and mypy cannot read TypeScript
      # or Svelte, so its gates run through npm. They need `npm install` in
      # packages/ov-dash first, which the package README says.
      - id: check-ov-dash
        name: tsc + svelte-check (ov-dash)
        entry: npm --prefix packages/ov-dash run check
        language: system
        pass_filenames: false
        files: ^packages/ov-dash/

      - id: lint-ov-dash
        name: biome (ov-dash)
        entry: npm --prefix packages/ov-dash run lint
        language: system
        pass_filenames: false
        files: ^packages/ov-dash/

      - id: test-ov-dash
        name: vitest (ov-dash)
        entry: npm --prefix packages/ov-dash test
        language: system
        pass_filenames: false
        files: ^packages/ov-dash/

      # ov-clip is the same story: a Firefox extension in TypeScript, with its
      # own toolchain and its own `npm install` to run first. Its lint also
      # builds and runs `web-ext lint`, which is what checks the manifest.
      - id: check-ov-clip
        name: tsc (ov-clip)
        entry: npm --prefix packages/ov-clip run check
        language: system
        pass_filenames: false
        files: ^packages/ov-clip/

      - id: lint-ov-clip
        name: biome + web-ext (ov-clip)
        entry: npm --prefix packages/ov-clip run lint
        language: system
        pass_filenames: false
        files: ^packages/ov-clip/

      - id: test-ov-clip
        name: vitest (ov-clip)
        entry: npm --prefix packages/ov-clip test
        language: system
        pass_filenames: false
        files: ^packages/ov-clip/
